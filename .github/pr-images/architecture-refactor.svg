<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="newGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="32" font-weight="700" fill="#1f2937" font-family="Arial, sans-serif">
    Complete Architecture Refactoring
  </text>
  <line x1="200" y1="60" x2="800" y2="60" stroke="#e5e7eb" stroke-width="2"/>

  <!-- BEFORE: Monolithic -->
  <rect x="50" y="100" width="400" height="60" fill="#fef2f2" rx="8"/>
  <text x="250" y="140" text-anchor="middle" font-size="24" font-weight="600" fill="#991b1b" font-family="Arial, sans-serif">
    Before: Monolithic
  </text>

  <g filter="url(#shadow)">
    <!-- Single Server -->
    <rect x="100" y="180" width="300" height="340" fill="url(#oldGrad)" rx="12"/>
    <text x="250" y="220" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">
      Single server.ts
    </text>
    <line x1="120" y1="235" x2="380" y2="235" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

    <!-- Components -->
    <rect x="120" y="260" width="260" height="50" fill="#ffffff" opacity="0.2" rx="6"/>
    <text x="250" y="290" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Arial, sans-serif">
      MCP Tools + API + HTTP all mixed
    </text>

    <rect x="120" y="330" width="260" height="50" fill="#ffffff" opacity="0.2" rx="6"/>
    <text x="250" y="355" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Arial, sans-serif">
      WalletServiceMCP (662 lines)
    </text>
    <text x="250" y="370" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
      God Class - all domains
    </text>

    <rect x="120" y="400" width="260" height="50" fill="#ffffff" opacity="0.2" rx="6"/>
    <text x="250" y="430" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Arial, sans-serif">
      No session management
    </text>

    <rect x="120" y="470" width="260" height="30" fill="#ffffff" opacity="0.2" rx="6"/>
    <text x="250" y="492" text-anchor="middle" font-size="13" fill="#ffffff" font-family="Arial, sans-serif">
      Single agent only
    </text>

    <!-- Problem badge -->
    <circle cx="370" cy="200" r="20" fill="#dc2626"/>
    <text x="370" y="208" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">
      !
    </text>
  </g>

  <!-- Arrow -->
  <path d="M 420 360 L 560 360" stroke="#3b82f6" stroke-width="6" fill="none"/>
  <path d="M 540 345 L 560 360 L 540 375" fill="#3b82f6"/>

  <!-- AFTER: Modular -->
  <rect x="570" y="100" width="400" height="60" fill="#f0fdf4" rx="8"/>
  <text x="770" y="140" text-anchor="middle" font-size="24" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
    After: Modular &amp; Scalable
  </text>

  <g filter="url(#shadow)">
    <!-- MCP STDIO Server -->
    <rect x="590" y="180" width="180" height="80" fill="#a7f3d0" stroke="#22c55e" stroke-width="2" rx="8"/>
    <text x="680" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
      MCP STDIO
    </text>
    <text x="680" y="230" text-anchor="middle" font-size="13" fill="#065f46" font-family="Arial, sans-serif">
      stdio-server.ts
    </text>
    <text x="680" y="248" text-anchor="middle" font-size="12" fill="#14532d" font-family="Arial, sans-serif">
      Claude Desktop
    </text>

    <!-- MCP HTTP Server -->
    <rect x="790" y="180" width="180" height="80" fill="#93c5fd" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="880" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a" font-family="Arial, sans-serif">
      MCP HTTP ⭐
    </text>
    <text x="880" y="230" text-anchor="middle" font-size="13" fill="#1e40af" font-family="Arial, sans-serif">
      http-server.ts
    </text>
    <text x="880" y="248" text-anchor="middle" font-size="12" fill="#1e3a8a" font-family="Arial, sans-serif">
      Multi-agent sessions
    </text>

    <!-- REST API Server -->
    <rect x="590" y="280" width="180" height="80" fill="#fde68a" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <text x="680" y="310" text-anchor="middle" font-size="16" font-weight="600" fill="#78350f" font-family="Arial, sans-serif">
      REST API
    </text>
    <text x="680" y="330" text-anchor="middle" font-size="13" fill="#92400e" font-family="Arial, sans-serif">
      api/server.ts
    </text>
    <text x="680" y="348" text-anchor="middle" font-size="12" fill="#78350f" font-family="Arial, sans-serif">
      HTTP endpoints
    </text>

    <!-- Shared Services -->
    <rect x="790" y="280" width="180" height="180" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="8"/>
    <text x="880" y="310" text-anchor="middle" font-size="16" font-weight="600" fill="#581c87" font-family="Arial, sans-serif">
      Services Layer
    </text>
    <line x1="810" y1="325" x2="950" y2="325" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="880" y="350" text-anchor="middle" font-size="13" fill="#6b21a8" font-family="Arial, sans-serif">
      WalletService
    </text>
    <text x="880" y="370" text-anchor="middle" font-size="13" fill="#6b21a8" font-family="Arial, sans-serif">
      TransactionService
    </text>
    <text x="880" y="390" text-anchor="middle" font-size="13" fill="#6b21a8" font-family="Arial, sans-serif">
      TokenService
    </text>
    <text x="880" y="410" text-anchor="middle" font-size="13" fill="#6b21a8" font-family="Arial, sans-serif">
      DaoService
    </text>
    <text x="880" y="430" text-anchor="middle" font-size="13" fill="#6b21a8" font-family="Arial, sans-serif">
      MarketplaceService
    </text>
    <text x="880" y="450" text-anchor="middle" font-size="12" fill="#6b21a8" opacity="0.8" font-family="Arial, sans-serif">
      Shared by all servers
    </text>

    <!-- Identus SDK -->
    <rect x="590" y="380" width="180" height="80" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="8"/>
    <text x="680" y="410" text-anchor="middle" font-size="16" font-weight="600" fill="#312e81" font-family="Arial, sans-serif">
      Identus SDK ⭐
    </text>
    <text x="680" y="430" text-anchor="middle" font-size="13" fill="#3730a3" font-family="Arial, sans-serif">
      identus-mcp/
    </text>
    <text x="680" y="448" text-anchor="middle" font-size="12" fill="#312e81" font-family="Arial, sans-serif">
      Real DID operations
    </text>

    <!-- Check badge -->
    <circle cx="950" cy="200" r="20" fill="#22c55e"/>
    <path d="M 942 200 L 948 206 L 958 193" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Benefits -->
  <rect x="50" y="550" width="920" height="40" fill="#dbeafe" rx="6"/>
  <text x="510" y="575" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af" font-family="Arial, sans-serif">
    ✓ 3 Independent Servers   ✓ Multi-Agent Sessions   ✓ Domain-Split Services   ✓ Real DID Integration   ✓ Professional API
  </text>
</svg>
