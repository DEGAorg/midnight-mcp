<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oldArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="newArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowOld" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444" />
    </marker>
    <marker id="arrowNew" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e" />
    </marker>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="26" font-weight="700" fill="#111827" font-family="Arial, sans-serif">
    Multi-Agent Architecture Evolution
  </text>

  <!-- Left Side: Old Studio-Based -->
  <rect x="20" y="70" width="400" height="60" fill="#fef2f2" rx="8"/>
  <text x="220" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#991b1b" font-family="Arial, sans-serif">
    Current: Studio-Based (Single Agent)
  </text>

  <!-- Studio box -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="160" width="300" height="280" fill="url(#oldArch)" rx="10"/>
    <rect x="70" y="160" width="300" height="50" fill="#000000" opacity="0.15" rx="10"/>
  </g>

  <text x="220" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    MCP Studio Mode
  </text>

  <!-- Single agent icon -->
  <circle cx="220" cy="250" r="35" fill="#ffffff" opacity="0.3"/>
  <circle cx="220" cy="250" r="25" fill="#ffffff" opacity="0.5"/>
  <text x="220" y="265" text-anchor="middle" font-size="36" fill="#ffffff" font-family="Arial, sans-serif">
    1
  </text>

  <text x="220" y="310" text-anchor="middle" font-size="14" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
    Single AI Agent
  </text>

  <line x1="90" y1="340" x2="350" y2="340" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

  <text x="220" y="370" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    Limited to one agent
  </text>
  <text x="220" y="390" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    per MCP server instance
  </text>
  <text x="220" y="415" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.8" font-family="Arial, sans-serif">
    Cannot scale for simulation
  </text>

  <!-- Right Side: New HTTP-Based -->
  <rect x="480" y="70" width="400" height="60" fill="#f0fdf4" rx="8"/>
  <text x="680" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
    Refactored: HTTP Client Sessions
  </text>

  <!-- HTTP Session box -->
  <g filter="url(#cardShadow)">
    <rect x="530" y="160" width="300" height="280" fill="url(#newArch)" rx="10"/>
    <rect x="530" y="160" width="300" height="50" fill="#000000" opacity="0.15" rx="10"/>
  </g>

  <text x="680" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    HTTP Client Mode
  </text>

  <!-- Multiple agents -->
  <g transform="translate(580, 230)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d" font-family="Arial, sans-serif">
      1
    </text>
  </g>

  <g transform="translate(640, 230)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d" font-family="Arial, sans-serif">
      2
    </text>
  </g>

  <g transform="translate(700, 230)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d" font-family="Arial, sans-serif">
      3
    </text>
  </g>

  <g transform="translate(760, 230)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d" font-family="Arial, sans-serif">
      N
    </text>
  </g>

  <text x="680" y="275" text-anchor="middle" font-size="14" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
    100-500 AI Agents
  </text>

  <line x1="550" y1="300" x2="810" y2="300" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

  <text x="680" y="330" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    Session-based isolation
  </text>
  <text x="680" y="350" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    Concurrent operations
  </text>
  <text x="680" y="370" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    Independent wallet states
  </text>
  <text x="680" y="395" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
    Scales for Midnight AI Simulation
  </text>

  <!-- Arrow between -->
  <g transform="translate(420, 300)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowNew)"/>
    <text x="25" y="-10" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a" font-family="Arial, sans-serif">
      Refactor
    </text>
  </g>

  <!-- Bottom info box -->
  <rect x="80" y="460" width="740" height="30" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2" rx="6"/>
  <text x="450" y="482" text-anchor="middle" font-size="13" fill="#374151" font-family="Arial, sans-serif">
    Transition enables concurrent agent operations required for 100-500 agent social simulation
  </text>
</svg>
