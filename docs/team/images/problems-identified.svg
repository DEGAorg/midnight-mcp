<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="28" font-weight="600" fill="#1f2937" font-family="Arial, sans-serif">
    Code Quality Issues Identified
  </text>
  <line x1="200" y1="55" x2="600" y2="55" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Issue 1: God Classes -->
  <g filter="url(#shadow)">
    <rect x="50" y="90" width="220" height="280" fill="url(#grad1)" rx="12"/>
    <rect x="50" y="90" width="220" height="60" fill="#000000" opacity="0.1" rx="12"/>
  </g>
  <text x="160" y="125" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">
    God Classes
  </text>
  <line x1="70" y1="145" x2="250" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

  <text x="160" y="180" text-anchor="middle" font-size="16" fill="#ffffff" font-family="Arial, sans-serif">
    WalletServiceMCP
  </text>
  <text x="160" y="210" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    662
  </text>
  <text x="160" y="235" text-anchor="middle" font-size="14" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    lines of code
  </text>

  <line x1="70" y1="255" x2="250" y2="255" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

  <text x="160" y="285" text-anchor="middle" font-size="16" fill="#ffffff" font-family="Arial, sans-serif">
    WalletManager
  </text>
  <text x="160" y="315" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    1,792
  </text>
  <text x="160" y="340" text-anchor="middle" font-size="14" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    lines of code
  </text>

  <!-- Issue 2: Mixed Concerns -->
  <g filter="url(#shadow)">
    <rect x="290" y="90" width="220" height="280" fill="url(#grad2)" rx="12"/>
    <rect x="290" y="90" width="220" height="60" fill="#000000" opacity="0.1" rx="12"/>
  </g>
  <text x="400" y="125" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">
    Mixed Concerns
  </text>
  <line x1="310" y1="145" x2="490" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

  <circle cx="400" cy="200" r="45" fill="#ffffff" opacity="0.2"/>
  <text x="400" y="210" text-anchor="middle" font-size="40" fill="#ffffff" font-family="Arial, sans-serif">
    ⚠
  </text>

  <text x="400" y="265" text-anchor="middle" font-size="15" fill="#ffffff" font-family="Arial, sans-serif">
    API + MCP Server
  </text>
  <text x="400" y="288" text-anchor="middle" font-size="15" fill="#ffffff" font-family="Arial, sans-serif">
    in same codebase
  </text>
  <text x="400" y="318" text-anchor="middle" font-size="14" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    Cannot scale
  </text>
  <text x="400" y="340" text-anchor="middle" font-size="14" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    independently
  </text>

  <!-- Issue 3: Magic Numbers -->
  <g filter="url(#shadow)">
    <rect x="530" y="90" width="220" height="280" fill="url(#grad3)" rx="12"/>
    <rect x="530" y="90" width="220" height="60" fill="#000000" opacity="0.1" rx="12"/>
  </g>
  <text x="640" y="125" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">
    Magic Numbers
  </text>
  <line x1="550" y1="145" x2="730" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

  <g transform="translate(640, 185)">
    <rect x="-50" y="0" width="100" height="35" fill="#ffffff" opacity="0.2" rx="6"/>
    <text x="0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff" font-family="Courier, monospace">
      3000
    </text>
  </g>

  <g transform="translate(640, 235)">
    <rect x="-50" y="0" width="100" height="35" fill="#ffffff" opacity="0.2" rx="6"/>
    <text x="0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff" font-family="Courier, monospace">
      6300
    </text>
  </g>

  <g transform="translate(640, 285)">
    <rect x="-50" y="0" width="100" height="35" fill="#ffffff" opacity="0.2" rx="6"/>
    <text x="0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff" font-family="Courier, monospace">
      5000ms
    </text>
  </g>

  <text x="640" y="350" text-anchor="middle" font-size="14" fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif">
    Hardcoded throughout
  </text>
</svg>
