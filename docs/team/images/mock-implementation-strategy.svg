<svg width="1000" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phase1Box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phase2Box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#111827" font-family="Arial, sans-serif">
    Mock Implementation Strategy
  </text>

  <!-- Phase 1 -->
  <g filter="url(#shadow)">
    <rect x="50" y="80" width="420" height="380" fill="url(#phase1Box)" stroke="#f59e0b" stroke-width="3" rx="12"/>
  </g>

  <!-- Phase 1 Header -->
  <rect x="50" y="80" width="420" height="60" fill="#fbbf24" rx="12"/>
  <text x="260" y="115" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    Phase 1: Mock Data
  </text>
  <text x="260" y="135" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
    Duration: 2 months
  </text>

  <!-- Phase 1 Content -->
  <circle cx="140" cy="190" r="25" fill="#f59e0b"/>
  <text x="140" y="198" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">
    100
  </text>
  <text x="200" y="195" font-size="15" font-weight="600" fill="#78350f" font-family="Arial, sans-serif">
    AI Agents
  </text>

  <circle cx="140" cy="230" r="25" fill="#f59e0b"/>
  <text x="140" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">
    24h
  </text>
  <text x="200" y="235" font-size="15" font-weight="600" fill="#78350f" font-family="Arial, sans-serif">
    Simulation Run
  </text>

  <line x1="80" y1="270" x2="440" y2="270" stroke="#f59e0b" stroke-width="2"/>

  <!-- Mock Server Box -->
  <rect x="80" y="290" width="360" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="260" y="315" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e" font-family="Arial, sans-serif">
    MCP Server
  </text>
  <text x="260" y="335" text-anchor="middle" font-size="13" fill="#78350f" font-family="Arial, sans-serif">
    Mock Branch
  </text>
  <rect x="200" y="345" width="120" height="22" fill="#fbbf24" rx="4"/>
  <text x="260" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">
    Returns Mock Data
  </text>

  <!-- Phase 1 Goals -->
  <text x="90" y="395" font-size="14" font-weight="600" fill="#92400e" font-family="Arial, sans-serif">
    Goals:
  </text>
  <text x="100" y="420" font-size="13" fill="#78350f" font-family="Arial, sans-serif">
    • Test agent behavior
  </text>
  <text x="100" y="440" font-size="13" fill="#78350f" font-family="Arial, sans-serif">
    • Measure costs
  </text>

  <!-- Arrow between phases -->
  <line x1="490" y1="270" x2="510" y2="270" stroke="#6b7280" stroke-width="3"/>
  <polygon points="505,260 525,270 505,280" fill="#6b7280"/>
  <text x="500" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#374151" font-family="Arial, sans-serif">
    Migrate
  </text>

  <!-- Phase 2 -->
  <g filter="url(#shadow)">
    <rect x="530" y="80" width="420" height="380" fill="url(#phase2Box)" stroke="#3b82f6" stroke-width="3" rx="12"/>
  </g>

  <!-- Phase 2 Header -->
  <rect x="530" y="80" width="420" height="60" fill="#3b82f6" rx="12"/>
  <text x="740" y="115" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    Phase 2: Production
  </text>
  <text x="740" y="135" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
    Duration: 1.5 months
  </text>

  <!-- Phase 2 Content -->
  <circle cx="620" cy="190" r="25" fill="#3b82f6"/>
  <text x="620" y="198" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">
    500
  </text>
  <text x="680" y="195" font-size="15" font-weight="600" fill="#1e3a8a" font-family="Arial, sans-serif">
    AI Agents
  </text>

  <circle cx="620" cy="230" r="25" fill="#3b82f6"/>
  <text x="620" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">
    ∞
  </text>
  <text x="680" y="235" font-size="15" font-weight="600" fill="#1e3a8a" font-family="Arial, sans-serif">
    Extended Runs
  </text>

  <line x1="560" y1="270" x2="920" y2="270" stroke="#3b82f6" stroke-width="2"/>

  <!-- Real Server Box -->
  <rect x="560" y="290" width="360" height="70" fill="#e0e7ff" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="740" y="315" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" font-family="Arial, sans-serif">
    MCP Server
  </text>
  <text x="740" y="335" text-anchor="middle" font-size="13" fill="#1e3a8a" font-family="Arial, sans-serif">
    Production Branch
  </text>
  <rect x="660" y="345" width="160" height="22" fill="#3b82f6" rx="4"/>
  <text x="740" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">
    Real Midnight L2 Chain
  </text>

  <!-- Phase 2 Features -->
  <text x="570" y="395" font-size="14" font-weight="600" fill="#1e40af" font-family="Arial, sans-serif">
    Features:
  </text>
  <text x="580" y="420" font-size="13" fill="#1e3a8a" font-family="Arial, sans-serif">
    • Real blockchain transactions
  </text>
  <text x="580" y="440" font-size="13" fill="#1e3a8a" font-family="Arial, sans-serif">
    • Privacy &amp; selective disclosure
  </text>

  <!-- Bottom note -->
  <rect x="100" y="475" width="800" height="15" fill="#f9fafb" rx="4"/>
  <text x="500" y="487" text-anchor="middle" font-size="12" fill="#374151" font-family="Arial, sans-serif">
    Strategy: Separate branches enable parallel development and smooth transition
  </text>
</svg>
