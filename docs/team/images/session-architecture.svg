<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="httpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sessionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowSession" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#111827" font-family="Arial, sans-serif">
    HTTP Session-Based Architecture
  </text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#6b7280" font-family="Arial, sans-serif">
    Multi-agent concurrent operations with session isolation
  </text>

  <!-- Agent Layer -->
  <text x="450" y="110" text-anchor="middle" font-size="18" font-weight="600" fill="#374151" font-family="Arial, sans-serif">
    AI Agents (100-500 concurrent)
  </text>

  <!-- Individual Agents -->
  <g filter="url(#boxShadow)">
    <rect x="80" y="130" width="140" height="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="150" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af" font-family="Arial, sans-serif">
      Agent 1
    </text>
    <text x="150" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Arial, sans-serif">
      Session: abc123
    </text>
    <text x="150" y="192" text-anchor="middle" font-size="10" fill="#1e3a8a" font-family="Arial, sans-serif">
      Wallet: 0x1a2b...
    </text>
  </g>

  <g filter="url(#boxShadow)">
    <rect x="250" y="130" width="140" height="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="320" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af" font-family="Arial, sans-serif">
      Agent 2
    </text>
    <text x="320" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Arial, sans-serif">
      Session: def456
    </text>
    <text x="320" y="192" text-anchor="middle" font-size="10" fill="#1e3a8a" font-family="Arial, sans-serif">
      Wallet: 0x3c4d...
    </text>
  </g>

  <g filter="url(#boxShadow)">
    <rect x="420" y="130" width="140" height="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="490" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af" font-family="Arial, sans-serif">
      Agent 3
    </text>
    <text x="490" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Arial, sans-serif">
      Session: ghi789
    </text>
    <text x="490" y="192" text-anchor="middle" font-size="10" fill="#1e3a8a" font-family="Arial, sans-serif">
      Wallet: 0x5e6f...
    </text>
  </g>

  <text x="650" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#6b7280" font-family="Arial, sans-serif">
    ...
  </text>

  <g filter="url(#boxShadow)">
    <rect x="700" y="130" width="140" height="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="770" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af" font-family="Arial, sans-serif">
      Agent N
    </text>
    <text x="770" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Arial, sans-serif">
      Session: xyz999
    </text>
    <text x="770" y="192" text-anchor="middle" font-size="10" fill="#1e3a8a" font-family="Arial, sans-serif">
      Wallet: 0x9g8h...
    </text>
  </g>

  <!-- Arrows down -->
  <line x1="150" y1="200" x2="150" y2="250" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowSession)"/>
  <line x1="320" y1="200" x2="320" y2="250" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowSession)"/>
  <line x1="490" y1="200" x2="490" y2="250" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowSession)"/>
  <line x1="770" y1="200" x2="770" y2="250" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowSession)"/>

  <!-- HTTP Server Layer -->
  <g filter="url(#boxShadow)">
    <rect x="100" y="250" width="700" height="80" fill="url(#httpGrad)" rx="10"/>
    <rect x="100" y="250" width="700" height="35" fill="#000000" opacity="0.1" rx="10"/>
  </g>

  <text x="450" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    HTTP Server with Session Manager
  </text>

  <text x="200" y="305" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
    POST /wallet/send
  </text>
  <text x="200" y="320" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.85" font-family="Courier, monospace">
    {sessionId: "abc123"}
  </text>

  <text x="450" y="305" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
    Session Routing
  </text>
  <text x="450" y="320" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.85" font-family="Arial, sans-serif">
    Isolates agent contexts
  </text>

  <text x="700" y="305" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
    Concurrent Handling
  </text>
  <text x="700" y="320" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.85" font-family="Arial, sans-serif">
    100-500 simultaneous
  </text>

  <!-- Arrow down -->
  <line x1="450" y1="330" x2="450" y2="370" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrowSession)"/>

  <!-- Service Layer -->
  <g filter="url(#boxShadow)">
    <rect x="100" y="370" width="700" height="120" fill="url(#serviceGrad)" rx="10"/>
    <rect x="100" y="370" width="700" height="40" fill="#000000" opacity="0.1" rx="10"/>
  </g>

  <text x="450" y="398" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    Shared Service Layer
  </text>

  <line x1="120" y1="420" x2="780" y2="420" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Service boxes -->
  <rect x="130" y="435" width="140" height="40" fill="#e9d5ff" stroke="#8b5cf6" stroke-width="1" rx="6"/>
  <text x="200" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87" font-family="Arial, sans-serif">
    WalletService
  </text>

  <rect x="290" y="435" width="140" height="40" fill="#e9d5ff" stroke="#8b5cf6" stroke-width="1" rx="6"/>
  <text x="360" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87" font-family="Arial, sans-serif">
    TransactionService
  </text>

  <rect x="450" y="435" width="140" height="40" fill="#e9d5ff" stroke="#8b5cf6" stroke-width="1" rx="6"/>
  <text x="520" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87" font-family="Arial, sans-serif">
    TokenService
  </text>

  <rect x="610" y="435" width="140" height="40" fill="#e9d5ff" stroke="#8b5cf6" stroke-width="1" rx="6"/>
  <text x="680" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87" font-family="Arial, sans-serif">
    DaoService
  </text>

  <!-- Arrow down -->
  <line x1="450" y1="490" x2="450" y2="520" stroke="#6366f1" stroke-width="3" marker-end="url(#arrowSession)"/>

  <!-- Database/Blockchain Layer -->
  <g filter="url(#boxShadow)">
    <rect x="150" y="520" width="600" height="60" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="8"/>
  </g>

  <text x="450" y="545" text-anchor="middle" font-size="16" font-weight="600" fill="#312e81" font-family="Arial, sans-serif">
    Database &amp; Midnight Blockchain
  </text>
  <text x="450" y="565" text-anchor="middle" font-size="12" fill="#3730a3" font-family="Arial, sans-serif">
    Session-isolated wallet states | Concurrent transaction processing
  </text>

  <!-- Key Features Box -->
  <rect x="80" y="595" width="740" height="5" fill="#10b981" rx="2"/>
</svg>
