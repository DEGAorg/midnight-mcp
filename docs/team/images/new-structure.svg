<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="libGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="moduleShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="32" font-weight="700" fill="#111827" font-family="Arial, sans-serif">
    Proposed File Structure
  </text>
  <text x="450" y="70" text-anchor="middle" font-size="16" fill="#6b7280" font-family="Arial, sans-serif">
    src/ directory organization
  </text>

  <!-- Root folder indicator -->
  <rect x="30" y="100" width="80" height="40" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2" rx="6"/>
  <text x="70" y="127" text-anchor="middle" font-size="18" font-weight="600" fill="#374151" font-family="Courier, monospace">
    src/
  </text>

  <!-- Connecting line -->
  <line x1="110" y1="120" x2="150" y2="120" stroke="#d1d5db" stroke-width="2"/>

  <!-- lib/ module -->
  <g filter="url(#moduleShadow)">
    <rect x="150" y="100" width="280" height="110" fill="url(#libGrad)" rx="10"/>
    <rect x="150" y="100" width="280" height="45" fill="#000000" opacity="0.15" rx="10"/>
    <text x="170" y="130" font-size="20" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
      lib/
    </text>
    <text x="170" y="165" font-size="14" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
      config/ logger/ database/
    </text>
    <text x="170" y="188" font-size="13" fill="#ffffff" opacity="0.85" font-family="Arial, sans-serif">
      Shared utilities and infrastructure
    </text>
  </g>

  <!-- services/ module -->
  <g filter="url(#moduleShadow)">
    <rect x="470" y="100" width="400" height="110" fill="url(#serviceGrad)" rx="10"/>
    <rect x="470" y="100" width="400" height="45" fill="#000000" opacity="0.15" rx="10"/>
    <text x="490" y="130" font-size="20" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
      services/
    </text>
    <circle cx="850" cy="122" r="12" fill="#fef08a"/>
    <text x="850" y="127" text-anchor="middle" font-size="16" font-weight="bold" fill="#713f12">
      ★
    </text>
    <text x="490" y="165" font-size="14" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
      wallet/ marketplace/ dao/
    </text>
    <text x="490" y="188" font-size="13" fill="#ffffff" opacity="0.85" font-family="Arial, sans-serif">
      Business logic layer
    </text>
  </g>

  <!-- api/ module -->
  <g filter="url(#moduleShadow)">
    <rect x="150" y="240" width="280" height="110" fill="url(#apiGrad)" rx="10"/>
    <rect x="150" y="240" width="280" height="45" fill="#000000" opacity="0.15" rx="10"/>
    <text x="170" y="270" font-size="20" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
      api/
    </text>
    <text x="170" y="305" font-size="14" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
      server.ts routes/ controllers/
    </text>
    <text x="170" y="328" font-size="13" fill="#ffffff" opacity="0.85" font-family="Arial, sans-serif">
      REST API endpoints (Express)
    </text>
  </g>

  <!-- mcp/ module -->
  <g filter="url(#moduleShadow)">
    <rect x="470" y="240" width="400" height="110" fill="url(#mcpGrad)" rx="10"/>
    <rect x="470" y="240" width="400" height="45" fill="#000000" opacity="0.15" rx="10"/>
    <text x="490" y="270" font-size="20" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
      mcp/
    </text>
    <text x="490" y="305" font-size="14" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
      stdio-server.ts tools/ handlers/
    </text>
    <text x="490" y="328" font-size="13" fill="#ffffff" opacity="0.85" font-family="Arial, sans-serif">
      MCP tools for AI agents (STDIO)
    </text>
  </g>

  <!-- contracts/ module -->
  <g filter="url(#moduleShadow)">
    <rect x="150" y="380" width="280" height="90" fill="#f472b6" rx="10"/>
    <rect x="150" y="380" width="280" height="40" fill="#000000" opacity="0.15" rx="10"/>
    <text x="170" y="408" font-size="18" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
      contracts/
    </text>
    <text x="170" y="440" font-size="13" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
      marketplace/ dao/
    </text>
    <text x="170" y="458" font-size="12" fill="#ffffff" opacity="0.85" font-family="Arial, sans-serif">
      Smart contract integrations
    </text>
  </g>

  <!-- types/ module -->
  <g filter="url(#moduleShadow)">
    <rect x="470" y="380" width="400" height="90" fill="#818cf8" rx="10"/>
    <rect x="470" y="380" width="400" height="40" fill="#000000" opacity="0.15" rx="10"/>
    <text x="490" y="408" font-size="18" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
      types/
    </text>
    <text x="490" y="440" font-size="13" fill="#ffffff" opacity="0.95" font-family="Arial, sans-serif">
      wallet.ts transaction.ts token.ts
    </text>
    <text x="490" y="458" font-size="12" fill="#ffffff" opacity="0.85" font-family="Arial, sans-serif">
      Shared TypeScript type definitions
    </text>
  </g>

  <!-- Key Principles Box -->
  <rect x="80" y="500" width="740" height="80" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2" rx="8"/>
  <text x="100" y="530" font-size="16" font-weight="600" fill="#111827" font-family="Arial, sans-serif">
    Key Principles:
  </text>
  <text x="120" y="555" font-size="14" fill="#374151" font-family="Arial, sans-serif">
    • No deep nesting (maximum 2-3 levels)
  </text>
  <text x="120" y="575" font-size="14" fill="#374151" font-family="Arial, sans-serif">
    • Feature-based organization (like Next.js)
  </text>
  <text x="480" y="555" font-size="14" fill="#374151" font-family="Arial, sans-serif">
    • Clear separation: API, MCP, Services
  </text>
  <text x="480" y="575" font-size="14" fill="#374151" font-family="Arial, sans-serif">
    • Easy to navigate and maintain
  </text>
</svg>
