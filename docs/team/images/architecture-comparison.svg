<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="newGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e" />
    </marker>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Headers -->
  <rect x="20" y="20" width="400" height="60" fill="#fef2f2" rx="8"/>
  <text x="220" y="60" text-anchor="middle" font-size="24" font-weight="600" fill="#991b1b" font-family="Arial, sans-serif">
    Current Architecture
  </text>

  <rect x="480" y="20" width="400" height="60" fill="#f0fdf4" rx="8"/>
  <text x="680" y="60" text-anchor="middle" font-size="24" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
    Proposed Architecture
  </text>

  <!-- CURRENT: Tangled -->
  <g filter="url(#cardShadow)">
    <!-- MCP Tool -->
    <rect x="50" y="120" width="140" height="50" fill="#fca5a5" stroke="#ef4444" stroke-width="2" rx="6"/>
    <text x="120" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d" font-family="Arial, sans-serif">
      MCP Tool
    </text>

    <!-- HTTP Layer -->
    <rect x="50" y="230" width="140" height="50" fill="#fed7aa" stroke="#f97316" stroke-width="2" rx="6"/>
    <text x="120" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12" font-family="Arial, sans-serif">
      HTTP Proxy
    </text>
    <text x="120" y="270" text-anchor="middle" font-size="11" fill="#9a3412" font-family="Arial, sans-serif">
      :3000
    </text>

    <!-- Controller -->
    <rect x="50" y="340" width="140" height="50" fill="#fde68a" stroke="#eab308" stroke-width="2" rx="6"/>
    <text x="120" y="370" text-anchor="middle" font-size="14" font-weight="600" fill="#713f12" font-family="Arial, sans-serif">
      Controller
    </text>

    <!-- God Class -->
    <rect x="240" y="220" width="160" height="120" fill="#fca5a5" stroke="#dc2626" stroke-width="3" rx="6"/>
    <text x="320" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d" font-family="Arial, sans-serif">
      God Class
    </text>
    <text x="320" y="275" text-anchor="middle" font-size="13" fill="#991b1b" font-family="Arial, sans-serif">
      WalletServiceMCP
    </text>
    <text x="320" y="295" text-anchor="middle" font-size="12" fill="#991b1b" font-family="Arial, sans-serif">
      662 lines
    </text>
    <text x="320" y="315" text-anchor="middle" font-size="11" fill="#991b1b" opacity="0.8" font-family="Arial, sans-serif">
      Wallet + Tokens + DAO
    </text>
    <text x="320" y="330" text-anchor="middle" font-size="11" fill="#991b1b" opacity="0.8" font-family="Arial, sans-serif">
      + Marketplace
    </text>

    <!-- Arrows -->
    <line x1="120" y1="170" x2="120" y2="220" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <line x1="120" y1="280" x2="120" y2="330" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <line x1="190" y1="280" x2="230" y2="280" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- Problem badges -->
    <circle cx="380" cy="145" r="18" fill="#dc2626"/>
    <text x="380" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">
      !
    </text>
  </g>

  <!-- NEW: Clean -->
  <g filter="url(#cardShadow)">
    <!-- API Server -->
    <rect x="510" y="120" width="150" height="60" fill="#93c5fd" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <text x="585" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a" font-family="Arial, sans-serif">
      API Server
    </text>
    <text x="585" y="165" text-anchor="middle" font-size="11" fill="#1e40af" font-family="Arial, sans-serif">
      Express :3000
    </text>

    <!-- MCP Server -->
    <rect x="700" y="120" width="150" height="60" fill="#a7f3d0" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="775" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b" font-family="Arial, sans-serif">
      MCP Server
    </text>
    <text x="775" y="165" text-anchor="middle" font-size="11" fill="#065f46" font-family="Arial, sans-serif">
      STDIO
    </text>

    <!-- Shared Services Layer -->
    <rect x="510" y="230" width="340" height="120" fill="#a7f3d0" stroke="#22c55e" stroke-width="3" rx="8"/>
    <text x="680" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d" font-family="Arial, sans-serif">
      Shared Services
    </text>
    <line x1="530" y1="275" x2="830" y2="275" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Individual services -->
    <rect x="530" y="290" width="85" height="30" fill="#dcfce7" stroke="#22c55e" stroke-width="1" rx="4"/>
    <text x="572" y="310" text-anchor="middle" font-size="11" fill="#14532d" font-family="Arial, sans-serif">
      WalletService
    </text>

    <rect x="630" y="290" width="100" height="30" fill="#dcfce7" stroke="#22c55e" stroke-width="1" rx="4"/>
    <text x="680" y="310" text-anchor="middle" font-size="11" fill="#14532d" font-family="Arial, sans-serif">
      TransactionService
    </text>

    <rect x="745" y="290" width="85" height="30" fill="#dcfce7" stroke="#22c55e" stroke-width="1" rx="4"/>
    <text x="787" y="310" text-anchor="middle" font-size="11" fill="#14532d" font-family="Arial, sans-serif">
      TokenService
    </text>

    <!-- Database -->
    <rect x="510" y="400" width="340" height="60" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="6"/>
    <text x="680" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81" font-family="Arial, sans-serif">
      Database Layer
    </text>
    <text x="680" y="445" text-anchor="middle" font-size="11" fill="#3730a3" font-family="Arial, sans-serif">
      SQLite + Blockchain
    </text>

    <!-- Arrows -->
    <line x1="585" y1="180" x2="630" y2="220" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <line x1="775" y1="180" x2="730" y2="220" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <line x1="680" y1="350" x2="680" y2="390" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Check badge -->
    <circle cx="840" cy="145" r="18" fill="#22c55e"/>
    <path d="M 832 145 L 838 151 L 848 138" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Labels -->
  <text x="220" y="435" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d" font-family="Arial, sans-serif">
    Tightly Coupled
  </text>
  <text x="220" y="455" text-anchor="middle" font-size="12" fill="#991b1b" font-family="Arial, sans-serif">
    Unnecessary HTTP calls
  </text>

  <text x="680" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
    Clean Separation
  </text>
</svg>
